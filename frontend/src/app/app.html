<a class="saltar" href="#contenido">Ir al contenido</a>

@if (sesion.estado() === 'activa') {
<header class="barra">
  <a class="marca" routerLink="/rol" aria-label="Rol de Turnos, inicio">
    <img class="marca__icono" src="favicon.svg" alt="" width="34" height="34" />
    <span class="marca__texto">
      <span class="marca__nombre">Rol de Turnos</span>
      <span class="marca__entidad">Distrito Fiscal de Cañete</span>
    </span>
  </a>

  <nav class="segmentado nav" aria-label="Secciones" appDeslizante>
    <span class="segmentado__indicador" aria-hidden="true"></span>
    @for (enlace of enlaces; track enlace.ruta) {
      <a
        class="segmentado__opcion nav__enlace"
        [routerLink]="enlace.ruta"
        routerLinkActive
        ariaCurrentWhenActive="page"
      >
        <app-icono [nombre]="enlace.icono" [tamano]="18" />
        <span>{{ enlace.texto }}</span>
      </a>
    }
  </nav>

  <button
    type="button"
    class="guardar"
    [attr.data-estado]="estado()"
    [disabled]="estado() === 'guardando'"
    [title]="tituloGuardar()"
    (click)="guardar()"
  >
    @switch (estado()) {
      @case ('guardando') {
        <app-icono class="girando" nombre="LoaderCircle" [tamano]="17" [trazo]="2.25" />
      }
      @case ('listo') {
        <app-icono class="guardar__check" nombre="Check" [tamano]="17" [trazo]="2.75" />
      }
      @default {
        <app-icono nombre="Save" [tamano]="17" [trazo]="2.25" />
      }
    }
    <span>{{ textoEstado() }}</span>
  </button>
  <span class="solo-lectores" role="status" aria-live="polite">{{ anuncioEstado() }}</span>

  <button type="button" class="boton boton--icono salir" (click)="salir()" title="Salir del sistema" aria-label="Salir del sistema">
    <app-icono nombre="LogOut" [tamano]="18" />
  </button>
</header>
}

<main id="contenido" class="contenido">
  <router-outlet />
</main>

<app-capa-avisos />
<app-dialogo-confirmacion />
